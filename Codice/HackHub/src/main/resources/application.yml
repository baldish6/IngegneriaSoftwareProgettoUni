#spring.application.name=HackHub
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hackhub
    username:
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop #update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

application:
  security:
    jwt:
      secret-key: eCqfIp0ilYQQaUoo73Y088zVVVniODZ8qlVEaFyrfL7
      expiration: 86400000 # a day
      refresh-token:
        expiration: 604800000 # 7 days
